name: Filesystem SO build and regression
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  standalone:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install native V2 build prerequisites
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential binutils cmake git libssl-dev libsqlite3-dev
      - name: Build native V2 filesystem shared object and run regression
        run: make test

      - name: Verify exact runtime payload without installing on the runner
        shell: bash
        run: |
          set -euo pipefail
          stage="$(mktemp -d)"
          trap 'rm -rf "$stage"' EXIT
          make DESTDIR="$stage" install
          expected="$(printf '%s\n' 'System/Filesystems/EXT2.so' 'System/Resources/Documentation/Filesystem-EXT2.pdf' | LC_ALL=C sort)"
          actual="$(cd "$stage" && find . -type f -printf '%P\n' | LC_ALL=C sort)"
          test "$actual" = "$expected"
          test "$(head -c 5 "$stage/System/Resources/Documentation/Filesystem-EXT2.pdf")" = '%PDF-'
